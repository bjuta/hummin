name: HUMMIN final one-shot React release gate
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/hummin-react-final-audit-trigger.txt] # Explicit one-shot signal; ordinary code edits cannot start this
  workflow_dispatch: # Optional manual launch if the workflow is available on the default branch
permissions:
  contents: read
concurrency:
  group: hummin-react-final-audit
  cancel-in-progress: true
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2 pngjs@7.0.0 pixelmatch@7.1.0
      - run: npx playwright install chromium --only-shell
      - name: Validate React source features and accessibility first (fail fast)
        run: node scripts/verify-react-canonical.mjs
      - name: Compare 42 production versus Preview screenshots only after canonical success
        run: node scripts/audit-react-visual-parity.mjs
      - name: Preserve design screenshots and read-only audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummin-native-react-canonical-design
          path: |
            artifacts/react-canonical
            artifacts/react-visual-parity
          retention-days: 14
