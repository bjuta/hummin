name: HUMMIN original Privacy/Terms legal visual parity
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/source-legal-parity-trigger.txt]
permissions:
  contents: read
jobs:
  legal-original-versus-native:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 pixelmatch@6.0.0 pngjs@7.0.0
      - run: npx playwright install chromium --only-shell
      - name: Enforce all six exact production versus native legal pixel cases
        run: node scripts/measure-source-legal-parity.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hummin-approved-legal-six-visual-cases
          path: artifacts/source-legal-parity
          retention-days: 14
