name: HUMMIN component geometry audit
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/hummin-component-geometry-trigger.txt]
permissions:
  contents: read
concurrency:
  group: hummin-component-geometry
  cancel-in-progress: false
jobs:
  geometry:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - name: Measure source and React component geometry (read only)
        run: node scripts/measure-react-components.mjs
      - name: Preserve complete geometry measurements and ranked triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummin-component-geometry
          path: artifacts/react-component-geometry
          retention-days: 14
