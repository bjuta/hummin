name: HUMMIN approved public-origin release
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/hummin-owner-approved-cutover-20261026.txt]
permissions:
  contents: read
concurrency:
  group: hummin-production-staging
  cancel-in-progress: false
jobs:
  publish-worker:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    environment: CF
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify full HUMMIN release
        run: |
          npm run check:production:config
          npm run verify:production:migrations
          npm run verify:seo
          npm run typecheck
      - name: Use explicit public site origin but no domain routes
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const f='wrangler.production.jsonc';
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            if(c.name!=='hummin-web-production'||c.keep_vars!==true||c.workers_dev!==true||c.routes||c.route||c.custom_domain)throw Error('Unsafe release settings');
            if(!c.d1_databases?.some(d=>d.database_id==='acd04e85-a433-463b-865f-a01f8aac3e27'))throw Error('Wrong D1');
            c.vars.SITE_URL='https://hummin.org';
            c.vars.BOOKING_ENABLED='true';
            c.vars.BOOKING_AVAILABILITY_ENABLED='true';
            c.vars.CONTACT_ENABLED='true';
            c.vars.ADMIN_AUTH_ENABLED='true';
            c.vars.EMAIL_FROM='HUMMIN <hello@hummin.org>';
            c.vars.EMAIL_FROM_NEWSLETTER='Notes from HUMMIN <notes@letters.hummin.org>';
            c.vars.EMAIL_FROM_PEOPLE='HUMMIN <hello@hummin.org>';
            c.vars.EMAIL_FROM_SYSTEM='HUMMIN Security <security@notify.hummin.org>';
            c.vars.GOOGLE_CALENDAR_ID='c_3fd57cf154990d87e2c6d51ee1b30ea35bd7eb6b74ac5be112040a534a3d5e48@group.calendar.google.com';
            c.vars.TURNSTILE_SITE_KEY='0x4AAAAAAFk826tr9GZGfmXb';
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          "
      - name: Build and deploy release Worker (no routes)
        env:
          HUMMIN_DEPLOY_TARGET: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run build
          npx wrangler deploy --config build/server/wrangler.json
      - name: Verify calendar-backed availability after deployment
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            const base='https://hummin-web-production.grimpossible.workers.dev';
            const r=await fetch(base+'/api/booking/slots',{signal:AbortSignal.timeout(25000)});
            const v=await r.json();
            assert.equal(r.status,200);
            assert.equal(v.enabled,true);
            assert.ok(Array.isArray(v.days)&&v.days.length>0);
            assert.ok(v.siteKey);
            console.log('PASS public-origin Worker with Google availability; no public routes assigned by this workflow');
          "
