name: HUMMIN one-time isolated staging rollout
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths:
      - .github/hummin-staging-one-shot-20261026.txt
permissions:
  contents: read
concurrency:
  group: hummin-production-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    environment: CF
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Confirm this is the isolated HUMMIN development branch
        run: |
          test "$GITHUB_REF" = "refs/heads/feat/fullstack-workers-foundation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f .github/hummin-staging-one-shot-20261026.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:production:config
      - run: npm run verify:production:migrations
      - run: npm run verify:production:wrangler-migrations
      - run: npm run verify:seo
      - run: npm run typecheck
      - name: Build isolated production Worker
        run: npm run build
        env:
          HUMMIN_DEPLOY_TARGET: production
      - name: Validate production Worker package
        run: |
          node scripts/verify-production-bundle.mjs
          npx wrangler deploy --config build/server/wrangler.json --dry-run --outdir .wrangler/production-package-check
      - name: Confirm authorised Cloudflare staging credentials exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing approved CF staging credentials"; exit 1;
          }
      - name: Apply tracked D1 migrations to isolated staging only
        run: npm run db:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy isolated staging Worker without custom routes
        run: npx wrangler deploy --config build/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Assert staging service availability and booking fail-closed
        run: node scripts/check-production-staging.mjs
