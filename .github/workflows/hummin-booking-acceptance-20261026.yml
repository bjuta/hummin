name: HUMMIN staging booking acceptance
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/hummin-booking-staging-trigger-20261026.txt]
permissions:
  contents: read
concurrency:
  group: hummin-production-staging
  cancel-in-progress: false
jobs:
  stage:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    environment: CF
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:production:config && npm run verify:production:migrations && npm run typecheck
      - name: Prepare isolated staging config, keeping secrets
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const f='wrangler.production.jsonc';
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            if(c.name!=='hummin-web-production'||c.keep_vars!==true||c.workers_dev!==true||c.routes||c.route||c.custom_domain) throw Error('Unsafe staging configuration');
            c.vars.SITE_URL='https://hummin-web-production.grimpossible.workers.dev';
            c.vars.BOOKING_ENABLED='true';
            c.vars.BOOKING_AVAILABILITY_ENABLED='true';
            fs.writeFileSync(f,JSON.stringify(c,null,2));
          "
      - name: Build and deploy isolated staging only
        env:
          HUMMIN_DEPLOY_TARGET: production
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm run build
          npx wrangler deploy --config build/server/wrangler.json
      - name: Validate live calendar-backed staging slots
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            const base='https://hummin-web-production.grimpossible.workers.dev';
            const r=await fetch(base+'/api/booking/slots',{signal:AbortSignal.timeout(25000)});
            const v=await r.json();
            assert.equal(r.status,200,'Staging slots HTTP');
            assert.equal(v.enabled,true,'Staging calendar enabled');
            assert.ok(Array.isArray(v.days)&&v.days.length>0,'Google FreeBusy produced days');
            assert.ok(typeof v.siteKey==='string'&&v.siteKey.length>5,'Turnstile challenge available');
            console.log('PASS isolated staging: live Google slots, Turnstile key, dual booking flags');
          "
