name: HUMMIN hero drag acceptance
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths:
      - scripts/verify-hero-grab.mjs
      - .github/workflows/hummin-hero-grab.yml
permissions:
  contents: read
jobs:
  hero-gesture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - run: node scripts/verify-hero-grab.mjs
