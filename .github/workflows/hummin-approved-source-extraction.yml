name: HUMMIN approved-source extraction
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/hummin-source-extraction-trigger.txt]
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund parse5@7.3.0
      - run: node scripts/extract-approved-source.mjs
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hummin-approved-source-extraction
          path: artifacts/approved-source-extraction
          retention-days: 14
