name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Package lock is added after a connected environment generates/verifies it.
      - run: npm install --no-audit --no-fund
      - run: npm run check:production:config
      - run: npm run verify:production:migrations
      - run: npm run verify:production:wrangler-migrations
      - run: npm run verify:seo
      - run: npm run typecheck
      - run: npm run build
      - name: Validate production Vite Worker bundle
        run: |
          HUMMIN_DEPLOY_TARGET=production npm run build
          node scripts/verify-production-bundle.mjs
      - run: npm run verify:restoration
      - run: npm run verify:insights
      - run: npm run verify:insights-publications
      - run: npm run verify:email
      - run: npm run verify:admin
      - run: npm run verify:admin-data
      - run: npm run verify:admin-fidelity
      - run: npm run verify:admin-operations
      - run: npm run verify:analytics
