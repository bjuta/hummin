name: HUMMIN Staging Browser Audit
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths:
      - scripts/audit-staging-browser.mjs
      - .github/workflows/hummin-staging-browser-audit.yml
permissions:
  contents: read
jobs:
  browser-audit:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated audit dependencies
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium browser
        run: npx playwright install chromium --only-shell
      - name: Run staging browser, layout and accessibility acceptance
        run: node scripts/audit-staging-browser.mjs
      - name: Archive evidence screenshots and violation summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummin-staging-browser-evidence
          path: artifacts/browser-audit
          retention-days: 14
