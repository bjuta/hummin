name: HUMMIN isolated native contact non-delivery acceptance
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/source-contact-functional-trigger.txt]
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - name: Pure input validation and transactional isolation
        run: node --experimental-strip-types --test tests/source-contact-contract.test.mjs
      - run: npm run typecheck
      - name: Browser contact validation at three widths without sending
        run: node scripts/accept-source-contact-functional.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hummin-source-contact-nondelivery-three-widths
          path: artifacts/source-contact-functional
          retention-days: 14
