name: HUMMIN source-faithful marketing Preview
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [.github/source-marketing-preview-trigger.txt]
permissions:
  contents: read
concurrency:
  group: hummin-source-marketing-preview
  cancel-in-progress: false
jobs:
  isolated-preview:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: CF
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Validate source-native code and safe marketing Preview route
        run: |
          npm run typecheck
          npm run build
          node --input-type=module -e "
            import fs from 'node:fs';
            const cfg=JSON.parse(fs.readFileSync('build/server/wrangler.json','utf8'));
            const text=JSON.stringify(cfg);
            if(cfg.name!=='hummin-web-preview'||cfg.workers_dev!==true||cfg.keep_vars!==true)throw Error('Not isolated preview');
            if(!text.includes('a6fb62df-824e-4231-8630-34ce1e6c27f4'))throw Error('Missing preview database');
            if(text.includes('acd04e85-a433-463b-865f-a01f8aac3e27'))throw Error('Production database detected');
            if(cfg.routes||cfg.route||cfg.custom_domain)throw Error('Public domain routing forbidden');
            if(!fs.readFileSync('app/routes/source.marketing.preview.tsx','utf8').includes('isHumminPublicHost(hostname)'))throw Error('Public-host preview guard missing');
            if(!fs.readFileSync('app/routes/source.remaining.preview.tsx','utf8').includes('isHumminPublicHost(hostname)'))throw Error('Remaining pages missing public-host guard');
          "
      - name: Deploy to isolated Workers dev Preview only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config build/server/wrangler.json
      - name: Check all seven owner-source React routes on staging
        run: |
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            const base='https://hummin-web-preview.grimpossible.workers.dev';
            for(const name of ['home','how','core','eng','who','about','contact']){
              const response=await fetch(base+'/__source-preview/'+name,{signal:AbortSignal.timeout(25000)});
              const body=await response.text();
              assert.equal(response.status,200,name+' expected HTTP 200');
              assert.ok(body.includes('HUMMIN'),name+' source brand not rendered');
              assert.ok(body.includes('id=\"main\"'),name+' source main absent');
              assert.match(response.headers.get('x-robots-tag')||'',/noindex/,name+' accidentally indexable');
              console.log('SOURCE STAGING PASS',name,body.length);
            for(const view of ['assessment','insights','article','topic','author']){
              const response=await fetch(base+'/__source-review/'+view,{signal:AbortSignal.timeout(25000)});
              const body=await response.text();
              assert.equal(response.status,200,view+' expected HTTP 200');
              assert.ok(body.includes('HUMMIN'),view+' source brand missing');
              assert.ok(body.includes('id=\\\"main\\\"'),view+' original site shell missing');
              assert.match(response.headers.get('x-robots-tag')||'',/noindex/,view+' accidentally indexable');
              console.log('REMAINING SOURCE STAGING PASS',view,body.length);
            }
            }
          "
