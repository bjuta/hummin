name: HUMMIN native React marketing acceptance
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths:
      - scripts/check-native-react-marketing.mjs
      - .github/workflows/hummin-native-react-acceptance.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
      - run: npx playwright install chromium --only-shell
      - run: node scripts/check-native-react-marketing.mjs
      - name: Save React screenshots and audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummin-react-marketing-screenshots
          path: artifacts/react-marketing
          retention-days: 14
