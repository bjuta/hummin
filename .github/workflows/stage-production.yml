name: Stage production infrastructure
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hummin-production-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    environment: production-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check:production:config
      - run: npm run typecheck
      - run: npm run build
      - name: Apply tracked production D1 migrations
        run: npm run db:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Stage isolated Worker (no public routes)
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Confirm staging Worker is reachable
        run: |
          curl --fail --silent --show-error --max-time 20 https://hummin-web-production.grimpossible.workers.dev/ >/dev/null
