name: HUMMIN React legal header parity
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths:
      - scripts/verify-react-legal-header.mjs
      - .github/workflows/hummin-react-legal-header.yml
permissions:
  contents: read
jobs:
  legal-parity:
    if: github.repository == 'bjuta/hummin'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright
        run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --only-shell
      - name: Test HTML-reference versus native React nav and scroll
        run: node scripts/verify-react-legal-header.mjs
      - name: Verify same React navigation and native scroll on public HUMMIN
        run: HUMMIN_URL=https://hummin.org node scripts/verify-react-legal-header.mjs
      - name: Save comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummin-react-legal-header
          path: artifacts/react-header
          retention-days: 14
