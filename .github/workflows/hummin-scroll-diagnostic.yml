name: HUMMIN live scroll diagnostic
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths: [scripts/diagnose-scroll.mjs, .github/workflows/hummin-scroll-diagnostic.yml]
permissions:
  contents: read
jobs:
  scroll-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install chromium --only-shell
      - run: node scripts/diagnose-scroll.mjs
