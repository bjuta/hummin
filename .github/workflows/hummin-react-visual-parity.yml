name: HUMMIN visual source fidelity (production vs React)
on:
  push:
    branches: [feat/fullstack-workers-foundation]
    paths:
      - scripts/audit-react-visual-parity.mjs
      - .github/workflows/hummin-react-visual-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1 pngjs@7.0.0 pixelmatch@7.1.0
      - run: npx playwright install chromium --only-shell
      - name: Compare source production with isolated React Preview (read-only)
        run: node scripts/audit-react-visual-parity.mjs
      - name: Preserve complete before / after / diff evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hummin-react-production-pixel-diffs
          path: artifacts/react-visual-parity
          retention-days: 14
